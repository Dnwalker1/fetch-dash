<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fetch Dash</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2b1f; overflow: hidden; touch-action: none; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
        background: rgba(29, 43, 31, 0.92); color: #fff; font: bold 22px Arial, sans-serif;
        text-align: center; padding: 16px; pointer-events: none; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
