# Builds an installable Android test APK of the phone app (mobile/) on EAS.
#
# Start it from the Actions tab: "Android test build" > "Run workflow", and pick
# the branch to build. The build itself runs on Expo's servers with the
# "preview" profile, so the Expo environment variables for preview
# (VITE_DYP_API_BASE, VITE_DYP_APP_KEY) are picked up there, as before.
# When it finishes, the run summary links the APK and the build page.
#
# Then (unless "smoke_test" is off) a second job installs the APK on an Android
# emulator, opens it, and keeps a screenshot and the phone's log as run
# artifacts, so a crash on launch shows up here with its error. To check an
# APK that's already built, give its link as "apk_url": the build is skipped.
#
# For Google Play, tick "play_build": the same job builds a signed Android App
# Bundle (.aab) with the "production" profile instead (real ads, the Expo
# "production" environment variables, version code raised by one on EAS).
# Upload that .aab to the closed testing track in Play Console. The emulator
# check is skipped for it, because an .aab can't be installed directly.
name: Android test build

on:
  workflow_dispatch:
    inputs:
      wait:
        description: Wait for the APK and link it in the run summary (uses about 10 to 20 Actions minutes)
        type: boolean
        default: true
      smoke_test:
        description: Then open the APK on an Android emulator and keep its log (needs wait)
        type: boolean
        default: true
      apk_url:
        description: Only test this already-built APK (skips the build)
        type: string
        default: ''
      play_build:
        description: Build the Google Play bundle (.aab, production profile, real ads) instead of a test APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-test-build-${{ github.ref }}-${{ inputs.play_build && 'play' || 'test' }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.apk_url == '' }}
    runs-on: ubuntu-latest
    # The EXPO_TOKEN secret lives in this GitHub environment.
    environment: fetch-dash-token
    timeout-minutes: 90
    outputs:
      apk: ${{ steps.eas.outputs.apk }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check for the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is empty. It must be a secret in the GitHub environment this job names."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install app dependencies
        run: npm ci

      - name: Check the Expo environment variables
        # Only names are printed. Hero portraits need both; without them the
        # build quietly falls back to the on-device stand-in picture.
        env:
          ENV_NAME: ${{ inputs.play_build && 'production' || 'preview' }}
        run: |
          if ! out=$(eas env:list "$ENV_NAME" --format short 2>/dev/null); then
            echo "::warning::Couldn't list the Expo \"$ENV_NAME\" environment variables; building anyway."
            exit 0
          fi
          names=$(echo "$out" | cut -d= -f1 | tr -d ' ')
          echo "Expo \"$ENV_NAME\" environment has: $(echo $names)"
          missing=""
          for n in VITE_DYP_API_BASE VITE_DYP_APP_KEY; do
            echo "$names" | grep -q "$n" || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in the Expo \"$ENV_NAME\" environment:$missing. Add them on expo.dev (Project > Environment variables) for $ENV_NAME, then run this again."
            exit 1
          fi

      - name: Build on EAS
        id: eas
        env:
          WAIT: ${{ inputs.wait }}
          PROFILE: ${{ inputs.play_build && 'production' || 'preview' }}
        run: |
          if [ "$WAIT" = "true" ]; then wait_flag=--wait; else wait_flag=--no-wait; fi
          eas build --profile "$PROFILE" --platform android --non-interactive --json $wait_flag > build.json
          id=$(jq -r '.[0].id' build.json)
          status=$(jq -r '.[0].status' build.json)
          file=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          code=$(jq -r '.[0].appBuildVersion // empty' build.json)
          page="https://expo.dev/accounts/goodwookies-team/projects/fetch-dash/builds/$id"
          if [ "$PROFILE" = "production" ]; then kind="AAB for Google Play"; else kind="APK"; fi
          {
            if [ "$PROFILE" = "production" ]; then echo "## Google Play build (.aab)"; else echo "## Android test build"; fi
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA::7}\`"
            echo "- EAS build: [$id]($page) ($status, profile $PROFILE)"
            [ -n "$code" ] && echo "- Version code: $code"
            if [ -n "$file" ]; then
              echo "- $kind: [download]($file)"
            else
              echo "- $kind: not ready yet. The build page has it when the build finishes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EAS build page: $page"
          [ -n "$file" ] && echo "$kind: $file"
          if [ "$PROFILE" = "preview" ]; then echo "apk=$file" >> "$GITHUB_OUTPUT"; fi
          if [ "$WAIT" = "true" ] && [ "$status" != "FINISHED" ]; then
            echo "::error::EAS build ended as $status. See $page"
            exit 1
          fi

  smoke:
    # Opens the APK on an emulator: does it start, or crash on launch?
    needs: build
    if: ${{ always() && inputs.smoke_test && !inputs.play_build && (inputs.apk_url != '' || needs.build.outputs.apk != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download the APK
        env:
          APK_URL: ${{ inputs.apk_url != '' && inputs.apk_url || needs.build.outputs.apk }}
        run: curl -sSfL -o app.apk "$APK_URL" && ls -la app.apk

      - name: Turn on KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write the launch check
        run: |
          cat > launch.sh <<'SH'
          set -x
          adb install -r app.apk
          adb logcat -c
          adb shell monkey -p com.goodwookie.fetchdash -c android.intent.category.LAUNCHER 1
          sleep 45
          if adb shell pidof com.goodwookie.fetchdash; then echo RUNNING > result.txt; else echo "NOT RUNNING" > result.txt; fi
          adb exec-out screencap -p > screen.png
          adb logcat -d > logcat.txt
          adb logcat -d -b crash > crash.txt
          exit 0
          SH
          chmod +x launch.sh

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./launch.sh

      - name: Report
        if: always()
        run: |
          {
            echo "## Launch check on an emulator (Android 14)"
            echo ""
            echo "- App after 45 s: **$(cat result.txt 2>/dev/null || echo unknown)**"
            echo ""
            echo "Crash log (if any):"
            echo '```'
            head -c 6000 crash.txt 2>/dev/null
            grep -E "FATAL|AndroidRuntime|ReactNativeJS|E/ReactNative|Ads|GoogleMobileAds" logcat.txt 2>/dev/null | grep -iE "fatal|error|exception|crash|caused by" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat crash.txt 2>/dev/null | head -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-check
          path: |
            screen.png
            logcat.txt
            crash.txt
            result.txt
